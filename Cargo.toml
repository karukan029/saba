workspace = { members = [ "net/wasabi","saba_core"] }
[package]
authors = ["karukan029"]
name = "saba"
version = "0.1.0"
edition = "2021"
default-run = "saba"

# Rustの条件付きコンパイルや依存関係の切り替えのための設定
# --features=wasabiのように指定できる
# 今の設定だと、optionnalになっているnet_wasabiとnoliはwasabi featureの場合のみ有効になる
# defautlではwasabi featureが有効になる
[features]
default = ["wasabi"]
wasabi = ["dep:net_wasabi", "dep:noli"]

# 実行可能なバイナリを指定
# required-featuresでこのバイナリをビルドするために必要なfeatureを指定できる
[[bin]]
name = "saba"
path = "src/main.rs"
required-features = ["wasabi"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
saba_core = { path = "./saba_core" }
net_wasabi = { path = "./net/wasabi", optional = true }
noli ={ git = "https://github.com/hikalium/wasabi.git", branch = "for_saba", optional = true}
